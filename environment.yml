name: fraud-detection-qwen
channels:
  - defaults
  - https://repo.anaconda.cloud/repo/community
  - https://repo.anaconda.cloud/repo/conda-forge
dependencies:
  # ============================================================================
  # CORE PYTHON
  # ============================================================================
  - python=3.11.14
  - pip=25.3
  - setuptools=80.9.0
  - wheel=0.45.1

  # ============================================================================
  # DATA SCIENCE STACK
  # ============================================================================
  - numpy=2.3.5
  - pandas=2.3.3
  - scipy=1.16.3
  - scikit-learn=1.7.2

  # ============================================================================
  # ML MODELS & EVALUATION
  # ============================================================================
  - xgboost=3.1.2
  - imbalanced-learn=0.14.0
  - shap=0.50.0
  - joblib=1.5.2

  # ============================================================================
  # VISUALIZATION
  # ============================================================================
  - matplotlib=3.10.7
  - seaborn=0.13.2
  - plotly=6.5.0
  - pillow=12.0.0

  # ============================================================================
  # DASHBOARD (Streamlit)
  # ============================================================================
  - streamlit=1.52.2

  # ============================================================================
  # HTTP / API CLIENT (replaces local torch + transformers inference)
  # ============================================================================
  - requests=2.32.5

  # ============================================================================
  # JUPYTER ENVIRONMENT
  # ============================================================================
  - jupyterlab=4.5.0
  - notebook=7.5.0
  - ipykernel=6.31.0
  - ipython=9.7.0
  - ipywidgets=8.1.7

  # ============================================================================
  # UTILITIES
  # ============================================================================
  - tqdm=4.67.1
  - pyyaml=6.0.3
  - packaging=25.0